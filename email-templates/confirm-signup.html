<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Confirm your email address</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f9f9f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#f9f9f9">
    <tr>
      <td align="center" style="padding: 40px 0;">
        <table width="600" border="0" cellspacing="0" cellpadding="0" bgcolor="#ffffff" style="max-width: 600px; width: 100%; border-radius: 12px; border: 1px solid #eaeaea; overflow: hidden; margin: 0 20px;">
          <tr>
            <td style="padding: 40px;">
              
              <table border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 24px;">
                <tr>
                  <td align="center" valign="middle" bgcolor="#111111" style="width: 48px; height: 48px; border-radius: 10px; color: #ffffff; font-weight: 600; font-size: 18px; letter-spacing: 1px;">
                    NX
                  </td>
                </tr>
              </table>
              
              <h1 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 700; color: #111111; letter-spacing: -0.5px;">
                Confirm your email address
              </h1>
              <p style="margin: 0 0 32px 0; font-size: 16px; line-height: 24px; color: #555555;">
                Welcome to Nexa! Please confirm your email address to complete your account setup and securely access your workspace.
              </p>
              
              <table border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 32px;">
                <tr>
                  <td align="center" bgcolor="#111111" style="border-radius: 8px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 14px 28px; font-size: 14px; font-weight: 500; color: #ffffff; text-decoration: none; border-radius: 8px;">
                      Confirm Email Address
                    </a>
                  </td>
                </tr>
              </table>
              
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="border-top: 1px solid #eaeaea; padding-top: 24px;">
                    <p style="margin: 0; font-size: 13px; line-height: 20px; color: #888888;">
                      If you didn't create an account with Nexa, you can safely ignore this email.
                    </p>
                  </td>
                </tr>
              </table>
              
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
